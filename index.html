<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>የእኔ ጥቁር ሰማያዊ ካልኩሌተር</title>
    <style>
        /* CSS (ሲ.ኤስ.ኤስ) - የካልኩሌተሩ ውበት እና ዲዛይን */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e3e8f0; /* ከጀርባ ያለው ቀለም */
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #0a192f; /* 🚀 የካልኩሌተሩ አካል ወደ ጥቁር ሰማያዊ ተቀይሯል */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
            width: 300px;
        }
        .display {
            width: 100%;
            height: 60px;
            background-color: #e0f7fa; /* ፈዛዛ ሰማያዊ ስክሪን */
            text-align: right;
            font-size: 30px;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            border: none;
            color: #333;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 22px;
            background-color: #f1f5f9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
        }
        button:active {
            background-color: #cbd5e1; /* ሲነካ ቀለሙ እንዲቀየር */
        }
        button.operator {
            background-color: #007bff; /* 🚀 የሂሳብ ምልክቶች ደመቅ ያለ ሰማያዊ ሆነዋል */
            color: white;
        }
        button.operator:active {
            background-color: #0056b3;
        }
        button.clear {
            background-color: #ef4444; /* ቀይ የማጥፊያ በተን */
            color: white;
            grid-column: span 4; /* አራት ቦታ እንዲይዝ (ሰፋ እንዲል) */
        }
        button.clear:active {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        
        <div class="buttons">
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="clear" onclick="clearDisplay()">አጥፋ (Clear)</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                let result = eval(display.value.replace('×', '*').replace('÷', '/'));
                display.value = result;
            } catch (error) {
                display.value = 'ስህተት!';
            }
        }
    </script>
</body>
</html>
