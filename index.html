<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>የእኔ ጥቁር ሰማያዊ ካልኩሌተር</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e3e8f0; 
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #0a192f; 
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
            width: 90%; 
            max-width: 400px;
        }
        .display {
            width: 100%;
            height: 80px; 
            font-size: 40px; 
            background-color: #e0f7fa; 
            text-align: right;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            border: none;
            color: #333;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px; 
            font-size: 26px; 
            background-color: #f1f5f9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
        }
        button:active {
            background-color: #cbd5e1;
        }
        button.operator {
            background-color: #007bff; 
            color: white;
        }
        button.operator:active {
            background-color: #0056b3;
        }
        /* 🚀 ወደ ኋላ መመለሻው በተን (ብርቱካናማ ቀለም) */
        button.delete {
            background-color: #f59e0b; 
            color: white;
            grid-column: span 2; /* ሁለት ቦታ እንዲይዝ */
        }
        button.delete:active {
            background-color: #d97706;
        }
        button.clear {
            background-color: #ef4444; 
            color: white;
            grid-column: span 2; /* ሁለት ቦታ እንዲይዝ */
        }
        button.clear:active {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        
        <div class="buttons">
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="delete" onclick="backspace()">⌫ ሰርዝ</button>
            <button class="clear" onclick="clearDisplay()">C አጥፋ</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        // 🚀 ወደ ኋላ የሚመልሰው አዲሱ ፎርሙላ
        function backspace() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                let result = eval(display.value.replace('×', '*').replace('÷', '/'));
                display.value = result;
            } catch (error) {
                display.value = 'ስህተት!';
            }
        }
    </script>
</body>
</html>
